name: Release (fork)

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      version:
        description: The fork version to publish, e.g. 1.0.0-rc.13-fork.2; must equal the shared package.json version plus -fork.N
        required: true
        type: string

concurrency:
  group: release-fork-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true
          require-lockfile: true

      - name: Build all packages
        env:
          GOMEMLIMIT: 6GiB
          GOGC: "40"
        run: pnpm build

      - name: Authenticate to GitHub Packages
        run: |
          echo '@pattobrien:registry=https://npm.pkg.github.com' >> .npmrc
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          node scripts/release/fork-publish.ts "${VERSION#v}"
